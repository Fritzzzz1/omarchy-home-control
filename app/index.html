set:hover,#settingsBtn:hover{background:#ffffff0d;color:var(--ink)}#reset:active,#settingsBtn:active{background:#ffffff14}.brand-sub{font-size:10px;color:var(--dim);letter-spacing:2px;margin-left:16px;text-transform:uppercase}.eyebrow{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--dim)}

      const { value, done } = await reader.read(); if (done) break;
      alive();
      buf += dec.decode(value, { stream: true });

      for (const p of parts) {
        const line = p.split('\n').find((l) => l.startsWith('data: ')); if (!line) continue;
        const ev = JSON.parse(line.slice(6));

        if (typeof ev.id === 'number' && ev.id > eventsCursor) { eventsCursor = ev.id; saveEventsState(); }

        if (ev.type === 'audio') { enqueue({ id: ev.id, url: ev.url, span: addPiece(ev.text) }); playNext(mine); }

      }
    }
  } catch (e) { setMode('error', e.name === 'AbortError' ? 'The answer went quiet; listening again' : e.message); }
  finally {
    clearTimeout(quiet);

}
// Some browsers reset the rate when a new src loads, so it is re-applied per piece and on metadata.
const applyRate = () => { try { player.preservesPitch = player.mozPreservesPitch = player.webkitPreservesPitch = true; player.playbackRate = speechRate; } catch {} };
for (const ev of ['loadedmetadata', 'canplay', 'play', 'playing']) player.addEventListener(ev, applyRate);   // iOS drops the rate at a few of these points
// One queue for every reply, ordered by when the server produced each sentence (its event id), so a

const enqueue = (piece) => { const i = queue.findIndex((q) => q.id > piece.id); if (i < 0) queue.push(piece); else queue.splice(i, 0, piece); };
// sentence audio plays in order as it arrives; the mic stays off until the last piece ends
function playNext(mine) {
  if (playing || !queue.length || mine !== currentTurn) return;
  playing = true; setMode('speaking', 'Speaking');
  const piece = queue.shift();
  if (nowSpan) { nowSpan.classList.remove('now'); nowSpan.classList.add('done'); }
  nowSpan = piece.span; nowSpan.classList.add('now'); nowSpan.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  player.src = piece.url; applyRate();
  const finish = () => { playing = false; player.onended = player.onerror = null; if (!queue.length && nowSpan) { nowSpan.classList.remove('now'); nowSpan.classList.add('done'); nowSpan = null; } playNext(mine); };
  player.onended = finish; player.onerror = finish;
  player.play().catch(() => { setMode('speaking', 'Tap the orb to hear the reply'); orb.onclick = () => { orb.onclick = orbTap; player.play(); }; });
}
const whilePlaying = () => new Promise((resolve) => { const tick = () => (playing || queue.length ? setTimeout(tick, 120) : resolve()); tick(); });
function interrupt() { if (!busy) return; currentTurn++; queue = []; player.pause(); playing = false; busy = false; if (nowSpan) { nowSpan.classList.remove('now'); nowSpan = null; } earOn(); fetch('/api/skip', { method: 'POST' }).catch(() => {}); }
// a tap on the orb: while busy it interrupts; in manual mode it starts/sends this utterance;
// otherwise it's a gesture that resumes the audio pipeline if iOS paused it (never done automatically)
async function orbTap() {
  if (busy) return interrupt();
  if (!on) return;
  if (micDead || yielded) { setMode('thinking', 'Opening the microphone'); try { await repairMic(); micDead = yielded = false; } catch (e) { setMode('error', 'Microphone: ' + (e.message || e)); return; } return earOn(); }
  if (voiceMode === 'manual') return toggleDictate();

orb.onclick = orbTap;
$('skip').onclick = interrupt;
$('pause').onclick = () => {
  if (!playing) return;
  setPaused(!paused);
  if (paused) { player.pause(); modeText.textContent = 'Paused'; } else { player.play(); modeText.textContent = 'Speaking'; }
};

// ---- the call button and the mic
const setBigIcon = (stopping) => { $('bigPlayIcon').style.display = stopping ? 'none' : ''; $('bigStopIcon').style.display = stopping ? '' : 'none'; big.setAttribute('aria-label', stopping ? 'End conversation' : 'Start conversation'); };
async function start() {
  unlock(); keepAwake();
  if (!audioCtx) audioCtx = new AudioContext();   // made inside the tap so iPhone never sees it suspended
  big.disabled = true;
  // Same gate as the foreground repair: Listening only once VAD frames arrive. A fresh mic that
  // opens silent (iPhone top-bar dot on, nothing reaching the page) gets one rebuild, then errors.
  try {
    setMode('thinking', 'Opening the microphone'); await startEar();
    if (!(await framesArrive())) { clientLog('start silent: ' + micState()); await repairMic(); }
  }
  catch (e) { setMode('error', 'Microphone: ' + (e.message || e)); hint.textContent = 'Allow the microphone for this page, then press play again.'; big.disabled = false; return; }
  on = true; yielded = false; big.classList.add('stop'); setBigIcon(true); big.disabled = false;
  setMode('listening', listeningLabel()); touch();
}
function end() { clearTimeout(idleTimer); on = false; micDead = micStale = yielded = false; earOff(); interrupt(); busy = false; dictating = false; dictateFrames = []; big.classList.remove('stop'); setBigIcon(false); setMode('off', 'Paused'); }
big.onclick = () => (on ? end() : start());
// shared visual toggle for the mute/ear-mute buttons: pressed state, label, and the slash icon
const setToggleButton = (btn, slashId, active, labelOn, labelOff) => { btn.classList.toggle('on', active); btn.setAttribute('aria-pressed', String(active)); btn.setAttribute('aria-label', active ? labelOn : labelOff); $(slashId).style.display = active ? '' : 'none'; };
// The first time a tap mutes on this device, a tip points out the button's other gesture for a few
// seconds. Once seen, never again (remembered per device).
const tip = $('tip');
let tipTimer = null;
const hideTip = () => { clearTimeout(tipTimer); tip.classList.remove('show'); };
const showTip = () => {
  try { if (localStorage.getItem('muteTipShown')) return; localStorage.setItem('muteTipShown', '1'); } catch {}
  const row = $('row');   // just under the row, the pointer on the mic button's middle
  tip.style.left = row.offsetLeft + 'px'; tip.style.top = (row.offsetTop + row.offsetHeight + 6) + 'px';
  tip.style.setProperty('--caret', (mute.offsetLeft - row.offsetLeft + mute.offsetWidth / 2 - 4) + 'px');
  tip.classList.add('show'); clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 4000);
};
tip.onclick = hideTip;
const toggleMute = () => {
  muted = !muted; setToggleButton(mute, 'micSlash', muted, 'Unmute microphone', 'Mute microphone');
  if (muted) showTip(); else hideTip();
  if (muted) {
    clientLog(`mute tapped: speechOpen=${speechOpen} speaking=${vad?.frameProcessor?.speaking} speechFrames=${vad?.frameProcessor?.speechFrameCount} dictating=${dictating}`);
    const sent = flushDictate(); earOff(); if (!sent && !busy) setMode('off', 'Muted');
  } else earOn();
};
// The mute button, one press at a time: a tap toggles mute (muting sends what was already said); a
// hold pauses the recording only while held and resumes it on release, without sending. The hold
// just unplugs the mic from the VAD, so nothing is processed meanwhile: an utterance in progress,
// or a manual dictation, carries on from where it was.
const HOLD_MS = 350, HOLD_LABEL = 'Paused — release to go on';
let holdTimer = null, holding = false, labelBeforeHold = '';
const holdStart = () => {
  const src = vad?._mediaStreamAudioSourceNode;
  if (!on || muted || busy || !vad?.listening || !src) return;
  try { src.disconnect(); } catch { return; }
  hideTip();
  holding = true; labelBeforeHold = modeText.textContent;
  mute.classList.add('on'); modeText.textContent = HOLD_LABEL;
};
const holdEnd = () => {
  if (!holding) return;
  holding = false; mute.classList.remove('on');
  try { vad._mediaStreamAudioSourceNode.connect(vad._vadNode); } catch {}
  if (modeText.textContent === HOLD_LABEL) modeText.textContent = labelBeforeHold;
};
mute.addEventListener('pointerdown', (e) => {
  try { mute.setPointerCapture(e.pointerId); } catch {}   // a finger that slides off the button still ends the press here
  clearTimeout(holdTimer); holdTimer = setTimeout(() => { holdTimer = null; holdStart(); }, HOLD_MS);
});
mute.addEventListener('pointerup', () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; toggleMute(); } else holdEnd(); });
mute.addEventListener('pointercancel', () => { clearTimeout(holdTimer); holdTimer = null; holdEnd(); });
mute.addEventListener('contextmenu', (e) => e.preventDefault());
mute.onclick = (e) => { if (e.detail === 0) toggleMute(); };   // keyboard (Enter/Space); pointer presses are handled above
const setEarMuted = (v) => { earMuted = v; player.muted = v; setToggleButton(earMute, 'earSlash', v, 'Unmute earphone', 'Mute earphone'); };
earMute.onclick = () => setEarMuted(!earMuted);
// Server state at load: speech rate, whether voice input works, and away. At home the reply plays
// on this machine's speakers, so the phone starts with its earphone muted; away, the phone is the
// only speaker and starts unmuted. Read once per page load. (setSpeechRate is a const further
// down; this callback runs after load, so it is defined by then.)
fetch('/api/state').then((r) => r.json()).then((s) => {
  const r = Number(s?.rate); if (RATES.includes(r) && r !== speechRate) setSpeechRate(r, false);
  if (s?.voiceInput === false) hint.textContent = 'Voice input is off on the server (whisper not running). Typing still works.';
  if (s?.away === false) setEarMuted(true);
}).catch(() => {});
// Opening the transcript pushes a history entry so the system/browser back action closes it
// instead of leaving the page — standalone (home-screen) iOS has no browser chrome at all, so
// there is no edge-swipe gesture to catch that the same way a normal Safari tab would; the
// touch handler further down covers that case by watching for a left-edge swipe directly.
let historyPushed = false;
// The three stat cards: fetched when the panel opens and again whenever a reply finishes (live
// or caught up), so the numbers stay current without reopening the panel.
const fmtTokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n));
const fmtCost = (n) => '$' + Number(n || 0).toFixed(2);
const fetchStats = () => fetch('/api/session-stats').then((r) => r.json()).then((s) => {
  $('statTurns').textContent = s.turns ?? 0;
  $('statTokens').textContent = fmtTokens(s.tokens ?? 0);
  $('statCost').textContent = fmtCost(s.costUsd);
}).catch(() => {});
const openHistory = () => { $('history').classList.add('open'); logEl.scrollTop = logEl.scrollHeight; fetchStats(); if (!historyPushed) { history.pushState({ voiceHistory: true }, ''); historyPushed = true; } };
const closeHistory = (viaPopstate) => { $('history').classList.remove('open'); if (historyPushed) { historyPushed = false; if (!viaPopstate) history.back(); } };
window.addEventListener('popstate', () => { if ($('history').classList.contains('open')) closeHistory(true); });
$('refresh').onclick = () => location.reload();
$('transcript').onclick = openHistory;
$('close').onclick = () => { closeHistory(false); $('transcript').focus(); };
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('history').classList.contains('open')) $('close').click(); if ($('settingsPanel').classList.contains('open')) closeSettings(); });

// ---- settings: three fields (mode/text/speed), each remembered per device. All three segmented
// controls share the same "highlight the active option" shape, so that part is a single helper.
const segButtons = (cls, dataKey, isActive) => { const buttons = document.querySelectorAll(cls); const apply = () => buttons.forEach((b) => { const active = isActive(b.dataset[dataKey]); b.setAttribute('aria-pressed', String(active)); b.setAttribute('aria-checked', String(active)); }); return { buttons, apply }; };

voiceModeSeg.apply();
voiceModeSeg.buttons.forEach((b) => { b.onclick = () => setVoiceMode(b.dataset.mode); });
const textFlowSeg = segButtons('.seg-text', 'text', (v) => v === textFlow);
const setTextFlow = (t) => { textFlow = t === 'flowing' ? 'flowing' : 'instant'; try { localStorage.setItem('textFlow', textFlow); } catch {} textFlowSeg.apply(); };
const rateSeg = segButtons('.seg-rate', 'rate', (v) => Number(v) === speechRate);
// The same number governs the machine's own speaker (what the TV plays), so a change here is

const setSpeechRate = (r, push = true) => { r = Number(r); speechRate = RATES.includes(r) ? r : 1; try { localStorage.setItem('speechRate', String(speechRate)); } catch {} rateSeg.apply(); applyRate(); if (push) fetch('/api/rate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rate: speechRate }) }).catch(() => {}); };
rateSeg.apply();

rateSeg.buttons.forEach((b) => { b.onclick = () => setSpeechRate(b.dataset.rate); });
textFlowSeg.apply();
textFlowSeg.buttons.forEach((b) => { b.onclick = () => setTextFlow(b.dataset.text); });
const openSettings = () => $('settingsPanel').classList.add('open');
const closeSettings = () => $('settingsPanel').classList.remove('open');
$('settingsBtn').onclick = openSettings;
$('settingsClose').onclick = closeSettings;
$('settingsPanel').addEventListener('click', (e) => { if (e.target === $('settingsPanel')) closeSettings(); });
$('send').onclick = () => { closeHistory(false); sendText($('text').value); };
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); closeHistory(false); sendText($('text').value); } });
// Left-edge swipe to close, matching iOS's own back gesture (which standalone mode has no
// chrome to provide): must start within 24px of the screen edge, then move right.
(() => {
  let sx = 0, sy = 0, tracking = false;
  const hist = $('history');
  hist.addEventListener('touchstart', (e) => { const t = e.touches[0]; tracking = t.clientX < 24; sx = t.clientX; sy = t.clientY; }, { passive: true });
  hist.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    if (t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) { tracking = false; closeHistory(false); }
  }, { passive: true });
  hist.addEventListener('touchend', () => { tracking = false; });
})();
// Shared by the header's #reset and the transcript panel's #clearLog — same effect either way.
// /api/reset clears the session before it responds, so the stats read back zero right after.
const resetConversation = async () => {
  await fetch('/api/reset', { method: 'POST' });
  logEl.innerHTML = ''; currentGroup = null;
  reply.textContent = ''; reply.style.display = 'none'; heard.classList.add('hidden');
  hint.style.display = ''; hint.textContent = nextStep() || '';
  fetchStats();
};
$('reset').onclick = resetConversation;
$('clearLog').onclick = resetConversation;

fetch('/api/transcript').then((r) => r.json()).then((rows) => { for (const row of rows.slice(-20)) { add('user', row.user); add('agent', row.spoken); } }).catch(() => {});

// ---- catch-up polling: reads the server's event log while this tab is foregrounded, so
// anything this device missed — a delayed relay reply from another session, or this same
// phone's own turn if it was backgrounded mid-turn — still reaches it. There is no separate
// rendering path here: a caught-up message goes through the exact same renderTurnText()/add()
// the live SSE path uses, and its audio goes through the exact same queue/playNext() the live
// path uses, so it inherits earMuted, the interrupt/skip handling, and the "don't play into a
// hot mic" protection for free.
// The cursor alone is the dedup mechanism: ids are monotonic, the poll always asks for
// "after=<cursor>", and the server only ever returns ids above it — on both the live SSE path
// and the catch-up path the cursor is advanced past every id seen, so nothing renders twice.

let eventsCursor = 0, eventsBootId = null;
try {
  const saved = JSON.parse(localStorage.getItem('eventsState') || 'null');
  if (saved && typeof saved.cursor === 'number') { eventsCursor = saved.cursor; eventsBootId = saved.bootId || null; }
} catch {}
const saveEventsState = () => { try { localStorage.setItem('eventsState', JSON.stringify({ cursor: eventsCursor, bootId: eventsBootId })); } catch {} };
const catchUpAudioByTurn = {};
// Plays a caught-up turn's sentences through the same player/queue/currentTurn mechanism turn()

// later; otherwise it takes the mic offline exactly like a live reply does.
async function playCatchUpAudio(turnId, full, from) {
  const pieces = (catchUpAudioByTurn[turnId] || []).filter(Boolean);
  delete catchUpAudioByTurn[turnId];
  if (!pieces.length) { renderTurnText(full, turnId, from); fetchStats(); return; }
  while (speechOpen || holding || (voiceMode === 'manual' && dictating)) await sleep(300);
  const joining = busy;
  if (!joining) { busy = true; earOff(); unlock(); ++currentTurn; queue = []; nowSpan = null; reply.textContent = ''; }

  // The same order as a live turn: the sentences on screen as they're queued, then renderTurnText
  // adds the conversation entry (and shows no text of its own, since the sentences are there).
  for (const p of pieces) { enqueue({ id: p.id, url: p.url, span: addPiece(p.text) }); playNext(mine); }
  renderTurnText(full, turnId, from);
  fetchStats();
  if (joining) return;   // the running turn waits for the whole queue before it gives the mic back

}
const handleCaughtUpEvent = async (ev) => {
  if (ev.type === 'transcript') {
    add('user', ev.text);
    if (!busy) showHeard(ev.text);   // don't clobber a live reply that's rendering right now
  } else if (ev.type === 'audio') {
    (catchUpAudioByTurn[ev.turnId] ||= [])[ev.index] = { id: ev.id, url: ev.url, text: ev.text };
  } else if (ev.type === 'text') {

let pollInFlight = false;   // the 15s interval and a visibilitychange firing close together must not overlap
const fetchAndApplyEvents = async () => {
  const res = await fetch('/api/events?after=' + eventsCursor);
  if (!res.ok) return;
  const data = await res.json();
  if (data.bootId && data.bootId !== eventsBootId) {
    // the server restarted since we last polled: its event log is gone, our cursor points

    eventsCursor = 0; eventsBootId = data.bootId; saveEventsState();
    return fetchAndApplyEvents();
  }

  // turn, while you're talking, or for a tap), and a reload during that wait must not show and
  // play it a second time.

async function pollEvents() {

}
setInterval(() => { if (document.visibilityState === 'visible') pollEvents(); }, 15000);

if (document.visibilityState === 'visible') pollEvents();

</script>
