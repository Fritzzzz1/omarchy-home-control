<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone Mic</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0b0f; color: #eee; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  button { font-size: 22px; padding: 22px 44px; border-radius: 16px; border: none; background: #2a6; color: #fff; }
  button.on { background: #c33; }
  button:active { opacity: 0.8; }
  #status { opacity: 0.7; font-size: 14px; }
  #err { color: #f88; font-size: 13px; max-width: 90vw; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
  <button id="go">Start</button>
  <div id="status">idle</div>
  <div id="err"></div>
<script>
const btn = document.getElementById('go');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
let ctx = null, node = null, source = null, stream = null, running = false;
let sendChain = Promise.resolve();

function setStatus(s) { statusEl.textContent = s; }

async function start() {
  errEl.textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
    });
  } catch (e) { errEl.textContent = 'Mic permission failed: ' + e.message; return; }

  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await fetch('/api/mic-start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rate: ctx.sampleRate }),
  });

  source = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain();
  mute.gain.value = 0; // never play the mic back out of the phone speaker

  node.onaudioprocess = (e) => {
    if (!running) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    sendChain = sendChain.then(() =>
      fetch('/api/mic-chunk', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: pcm.buffer })
        .catch(() => {}),
    );
  };

  source.connect(node);
  node.connect(mute);
  mute.connect(ctx.destination);

  running = true;
  btn.textContent = 'Stop';
  btn.classList.add('on');
  setStatus('streaming @ ' + Math.round(ctx.sampleRate) + 'Hz -> Phone_Mic on the desktop');
}

async function stop() {
  running = false;
  try { node && node.disconnect(); } catch {}
  try { source && source.disconnect(); } catch {}
  try { stream && stream.getTracks().forEach((t) => t.stop()); } catch {}
  try { ctx && (await ctx.close()); } catch {}
  await fetch('/api/mic-stop', { method: 'POST' }).catch(() => {});
  btn.textContent = 'Start';
  btn.classList.remove('on');
  setStatus('idle');
}

btn.onclick = () => (running ? stop() : start());
window.addEventListener('pagehide', () => { if (running) navigator.sendBeacon?.('/api/mic-stop', new Blob()); });
</script>
</body>
</html>
